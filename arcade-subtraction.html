<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0a0a1a"/>
<title>Subtraction — Math Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a0a1a;--navy2:#0f1530;--navy3:#1a2448;
  --accent:#ff4fa3;--accent-dim:rgba(255,79,163,0.15);
  --gold:#f0c040;--white:#fff;--dim:rgba(255,255,255,0.45);
  --red:#ff4444;--green:#39ff14;
}
html,body{height:100%;background:var(--navy);color:var(--white);font-family:'Outfit',sans-serif;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1) 0px,rgba(0,0,0,0.1) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9999}
.top-bar{background:var(--navy2);border-bottom:2px solid var(--accent);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.back-btn{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--accent);text-decoration:none;letter-spacing:.08em;text-shadow:0 0 8px var(--accent);}
.op-badge{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--accent);text-shadow:0 0 10px var(--accent);letter-spacing:.1em}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}
#screen-home{padding:20px;gap:16px;overflow-y:auto}
.game-title{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4vw,24px);color:var(--accent);text-shadow:0 0 20px var(--accent),0 0 40px rgba(255,79,163,.3);text-align:center;line-height:1.5;padding:12px 0}
.mastery-label{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);letter-spacing:.1em;margin-bottom:10px;text-align:center}
.fact-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:4px}
.fact-chip{background:var(--navy2);border:2px solid rgba(255,255,255,.1);border-radius:3px;padding:8px 4px;text-align:center;cursor:pointer;transition:transform .1s,border-color .1s;-webkit-tap-highlight-color:transparent;}
.fact-chip:active{transform:scale(.9)}
.fc-label{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--white)}
.fc-status{font-size:8px;margin-top:3px;font-family:'Press Start 2P',monospace}
.fact-chip[data-mastery="none"]{border-color:rgba(255,255,255,.12)}
.fact-chip[data-mastery="none"] .fc-status{color:rgba(255,255,255,.25)}
.fact-chip[data-mastery="practicing"]{border-color:var(--gold)}
.fact-chip[data-mastery="practicing"] .fc-status{color:var(--gold)}
.fact-chip[data-mastery="mastered"]{border-color:var(--green);background:rgba(57,255,20,.08)}
.fact-chip[data-mastery="mastered"] .fc-status{color:var(--green)}
.fact-chip[data-mastery="selected"]{border-color:var(--accent);background:var(--accent)}
.fact-chip[data-mastery="selected"] .fc-label{color:var(--navy)}
.fact-chip[data-mastery="selected"] .fc-status{color:var(--navy)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-card{background:var(--navy2);border:2px solid rgba(255,255,255,.1);border-radius:3px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .12s;-webkit-tap-highlight-color:transparent;}
.mode-card.selected{border-color:var(--accent);box-shadow:0 0 10px rgba(255,79,163,.3)}
.mode-icon{font-size:22px;margin-bottom:6px}
.mode-name{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--white);line-height:1.5}
.mode-desc{font-size:10px;color:var(--dim);margin-top:4px}
.btn-start{width:100%;padding:16px;background:var(--accent);color:var(--white);border:none;border-radius:3px;font-family:'Press Start 2P',monospace;font-size:12px;cursor:pointer;letter-spacing:.1em;transition:filter .1s,transform .1s;box-shadow:0 0 20px rgba(255,79,163,.4);}
.btn-start:active{transform:scale(.97)}
.btn-start:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.3);box-shadow:none;cursor:not-allowed}
.quiz-hud{background:var(--navy2);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:2px solid var(--accent);}
.hud-stat{text-align:center;min-width:44px}
.hud-val{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--white)}
.hud-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);margin-top:2px;letter-spacing:.06em}
.timer-wrap{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#timer-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .25s linear,background .25s;box-shadow:0 0 8px var(--accent)}
#timer-bar.warn{background:var(--red);box-shadow:0 0 8px var(--red)}
.fact-badge{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--white);background:var(--accent);padding:4px 10px;border-radius:2px;flex-shrink:0}
.problem-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.problem-eq{font-family:'Press Start 2P',monospace;font-size:clamp(28px,8vw,48px);color:var(--white);text-align:center;line-height:1.4;text-shadow:0 0 20px rgba(255,79,163,.2)}
.problem-eq .op{color:var(--accent);text-shadow:0 0 12px var(--accent)}
.answer-display{font-family:'Press Start 2P',monospace;font-size:clamp(24px,6vw,36px);color:var(--accent);text-shadow:0 0 12px var(--accent);min-height:44px;text-align:center;letter-spacing:.1em;}
.answer-display.ph{color:rgba(255,255,255,.2);font-size:20px}
.feedback{height:32px;display:flex;align-items:center;justify-content:center}
.fb-msg{font-family:'Press Start 2P',monospace;font-size:10px;padding:6px 16px;border-radius:2px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.fb-msg.show{opacity:1;transform:translateY(0)}
.fb-msg.ok{background:rgba(57,255,20,.15);color:var(--green);border:1px solid var(--green)}
.fb-msg.no{background:rgba(255,68,68,.15);color:var(--red);border:1px solid var(--red)}
.numpad-wrap{padding:8px 12px 16px;flex-shrink:0}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.np{background:var(--navy3);border:1px solid rgba(255,79,163,.2);border-radius:3px;padding:16px 6px;font-family:'Press Start 2P',monospace;font-size:16px;color:var(--white);cursor:pointer;text-align:center;transition:background .08s,transform .08s;-webkit-tap-highlight-color:transparent;}
.np:active{transform:scale(.9);background:var(--accent);color:var(--white)}
.np.clr{background:rgba(255,68,68,.12);border-color:rgba(255,68,68,.3);color:var(--red)}
.np.clr:active{background:var(--red);color:#fff}
.np.ent{background:var(--accent);color:var(--white);font-size:10px;border-color:var(--accent);box-shadow:0 0 10px rgba(255,79,163,.3)}
.np.ent:active{background:#fff;color:var(--navy)}
#screen-results{padding:20px;gap:16px;overflow-y:auto;align-items:center;justify-content:center}
.result-title{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4vw,22px);color:var(--accent);text-shadow:0 0 16px var(--accent);text-align:center;line-height:1.5}
.result-emoji{font-size:56px;text-align:center}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rs{background:var(--navy2);border:1px solid rgba(255,79,163,.2);border-radius:3px;padding:14px 8px;text-align:center}
.rs-val{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--accent)}
.rs-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);margin-top:6px;letter-spacing:.06em}
.mastery-result{background:var(--navy2);border:1px solid rgba(255,79,163,.15);border-radius:3px;padding:16px;width:100%}
.mr-title{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);letter-spacing:.1em;margin-bottom:10px}
.mr-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.mr-row:last-child{border-bottom:none}
.mr-name{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--white)}
.mr-pill{font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 8px;border-radius:2px}
.mr-pill.none{background:rgba(255,255,255,.08);color:var(--dim)}
.mr-pill.practicing{background:rgba(240,192,64,.15);color:var(--gold)}
.mr-pill.mastered{background:rgba(57,255,20,.15);color:var(--green)}
.btn-row{display:flex;gap:8px;width:100%}
.btn-again{flex:2;padding:14px;background:var(--accent);color:var(--white);border:none;border-radius:3px;font-family:'Press Start 2P',monospace;font-size:10px;cursor:pointer;letter-spacing:.08em;box-shadow:0 0 16px rgba(255,79,163,.3)}
.btn-home{flex:1;padding:14px;background:transparent;color:var(--dim);border:1px solid rgba(255,255,255,.2);border-radius:3px;font-family:'Press Start 2P',monospace;font-size:9px;cursor:pointer;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <a href="math-arcade.html" class="back-btn">← ARCADE</a>
    <span class="op-badge">− SUBTRACTION</span>
    <span></span>
  </div>
  <div id="screen-home" class="screen active">
    <div class="game-title">SUBTRACTION<br>STRIKE</div>
    <p class="mastery-label">CHOOSE YOUR NUMBERS</p>
    <div class="fact-grid" id="fact-grid"></div>
    <div style="margin:4px 0 8px">
      <p class="mastery-label" style="margin-bottom:8px">CHOOSE MODE</p>
      <div class="mode-grid">
        <div class="mode-card selected" data-mode="timed60" onclick="selectMode(this)"><div class="mode-icon">⚡</div><div class="mode-name">60 SEC<br>BLITZ</div><div class="mode-desc">Speed run</div></div>
        <div class="mode-card" data-mode="timed120" onclick="selectMode(this)"><div class="mode-icon">🏃</div><div class="mode-name">2 MIN<br>RUN</div><div class="mode-desc">More time</div></div>
        <div class="mode-card" data-mode="practice20" onclick="selectMode(this)"><div class="mode-icon">🎯</div><div class="mode-name">20<br>SHOTS</div><div class="mode-desc">No timer</div></div>
        <div class="mode-card" data-mode="mastery" onclick="selectMode(this)"><div class="mode-icon">🏆</div><div class="mode-name">MASTERY<br>CHECK</div><div class="mode-desc">10 to earn ✓</div></div>
      </div>
    </div>
    <button class="btn-start" id="start-btn" onclick="startQuiz()" disabled>SELECT NUMBERS FIRST</button>
  </div>
  <div id="screen-quiz" class="screen">
    <div class="quiz-hud">
      <div class="hud-stat"><div class="hud-val" id="hud-score">0</div><div class="hud-label">SCORE</div></div>
      <div class="timer-wrap"><div id="timer-bar"></div></div>
      <div class="hud-stat" id="hud-timer-stat"><div class="hud-val" id="hud-timer">60</div><div class="hud-label">SEC</div></div>
      <div class="hud-stat" id="hud-count-stat" style="display:none"><div class="hud-val" id="hud-count">0</div><div class="hud-label">LEFT</div></div>
      <div class="fact-badge" id="fact-badge">-1</div>
    </div>
    <div class="problem-zone">
      <div class="problem-eq"><span id="q-a">?</span><span class="op"> − </span><span id="q-b">?</span><span class="op"> = </span></div>
      <div class="answer-display ph" id="ans-display">_ _</div>
      <div class="feedback"><div class="fb-msg" id="feedback"></div></div>
    </div>
    <div class="numpad-wrap">
      <div class="numpad">
        <div class="np" onclick="np('1')">1</div><div class="np" onclick="np('2')">2</div><div class="np" onclick="np('3')">3</div>
        <div class="np" onclick="np('4')">4</div><div class="np" onclick="np('5')">5</div><div class="np" onclick="np('6')">6</div>
        <div class="np" onclick="np('7')">7</div><div class="np" onclick="np('8')">8</div><div class="np" onclick="np('9')">9</div>
        <div class="np" onclick="np('0')">0</div><div class="np clr" onclick="npClear()">⌫</div><div class="np ent" onclick="submit()">OK</div>
      </div>
    </div>
  </div>
  <div id="screen-results" class="screen">
    <div class="result-emoji" id="r-emoji">🌟</div>
    <div class="result-title" id="r-title">GREAT!</div>
    <div class="result-stats">
      <div class="rs"><div class="rs-val" id="r-correct">0</div><div class="rs-label">CORRECT</div></div>
      <div class="rs"><div class="rs-val" id="r-total">0</div><div class="rs-label">TRIED</div></div>
      <div class="rs"><div class="rs-val" id="r-pct">0%</div><div class="rs-label">ACCURACY</div></div>
    </div>
    <div class="mastery-result"><div class="mr-title">PROGRESS UPDATE</div><div id="mr-rows"></div></div>
    <div class="btn-row">
      <button class="btn-again" onclick="startQuiz()">PLAY AGAIN</button>
      <button class="btn-home" onclick="goHome()">HOME</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY='ccaSubMastery';
const FACTS=Array.from({length:20},(_,i)=>i+1);
let sel=[],mode='timed60',answer='',score=0,correct=0,attempted=0;
let timeLeft=60,totalTime=60,qLeft=0,timer=null,feedTimer=null,active=false,sessionRes={};
function getMastery(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}}}
function saveMastery(m){localStorage.setItem(STORAGE_KEY,JSON.stringify(m))}
function masteryLevel(f){const m=getMastery(),d=m[f];if(!d)return'none';if(d.attempted>=10&&(d.correct/d.attempted)>=0.8)return'mastered';if(d.attempted>0)return'practicing';return'none';}
function updateMastery(f,c,a){const m=getMastery();if(!m[f])m[f]={correct:0,attempted:0};m[f].correct+=c;m[f].attempted+=a;saveMastery(m);}
function renderGrid(){
  const g=document.getElementById('fact-grid');g.innerHTML='';
  FACTS.forEach(f=>{
    const level=sel.includes(f)?'selected':masteryLevel(f);
    const labels={none:'NEW',practicing:'...',mastered:'✓',selected:'GO'};
    g.innerHTML+=`<div class="fact-chip" data-fact="${f}" data-mastery="${level}" onclick="toggleFact(${f})"><div class="fc-label">${f}</div><div class="fc-status">${labels[level]}</div></div>`;
  });
}
function toggleFact(f){const i=sel.indexOf(f);if(i>-1)sel.splice(i,1);else sel.push(f);updateBtn();renderGrid();}
function updateBtn(){const b=document.getElementById('start-btn');b.disabled=sel.length===0;b.textContent=sel.length>0?'START GAME →':'SELECT NUMBERS FIRST';}
function selectMode(el){document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');mode=el.dataset.mode;}
function generateQ(){
  const f=sel[Math.floor(Math.random()*sel.length)];
  // subtraction: bigger - smaller, result >= 0, using f as the larger number
  const big=f+Math.floor(Math.random()*(20-f));
  const small=Math.floor(Math.random()*f)+1<=big?Math.floor(Math.random()*f)+1:f;
  window._qa=Math.max(big,small);window._qb=Math.min(big,small);
  window._qa=f+Math.floor(Math.random()*(20-f));
  window._qb=Math.floor(Math.random()*(f-1))+1;
  if(window._qa<window._qb){const tmp=window._qa;window._qa=window._qb;window._qb=tmp;}
  window._fact=f;
  document.getElementById('q-a').textContent=window._qa;
  document.getElementById('q-b').textContent=window._qb;
  document.getElementById('fact-badge').textContent='-'+f;
  answer='';updateAns();clearFb();
}
function updateAns(){const el=document.getElementById('ans-display');if(answer===''){el.textContent='_ _';el.className='answer-display ph';}else{el.textContent=answer;el.className='answer-display';}}
function np(d){if(!active||answer.length>=3)return;answer+=d;updateAns();}
function npClear(){if(!active)return;answer=answer.slice(0,-1);updateAns();}
function submit(){
  if(!active||answer==='')return;
  const right=parseInt(answer)===(window._qa-window._qb);
  attempted++;
  const f=window._fact;
  if(!sessionRes[f])sessionRes[f]={correct:0,attempted:0};
  sessionRes[f].attempted++;
  if(right){score++;correct++;sessionRes[f].correct++;showFb(true);}
  else showFb(false,window._qa-window._qb);
  document.getElementById('hud-score').textContent=score;
  if(mode==='practice20'||mode==='mastery'){qLeft--;document.getElementById('hud-count').textContent=qLeft;updateBar(qLeft,totalTime);if(qLeft<=0){endQuiz();return;}}
  setTimeout(()=>generateQ(),right?350:750);
}
function showFb(ok,ans){const el=document.getElementById('feedback');el.textContent=ok?'✓ CORRECT!':'✗ '+ans;el.className='fb-msg show '+(ok?'ok':'no');clearTimeout(feedTimer);feedTimer=setTimeout(clearFb,900);}
function clearFb(){document.getElementById('feedback').classList.remove('show');}
function updateBar(cur,tot){const pct=(cur/tot)*100;const bar=document.getElementById('timer-bar');bar.style.width=pct+'%';bar.className=pct<25?'warn':'';}
function startQuiz(){
  if(sel.length===0)return;
  score=0;correct=0;attempted=0;answer='';active=true;sessionRes={};clearInterval(timer);
  const ts=document.getElementById('hud-timer-stat'),cs=document.getElementById('hud-count-stat');
  if(mode==='timed60'){totalTime=60;ts.style.display='';cs.style.display='none';runTimer(60);}
  else if(mode==='timed120'){totalTime=120;ts.style.display='';cs.style.display='none';runTimer(120);}
  else if(mode==='practice20'){qLeft=20;totalTime=20;ts.style.display='none';cs.style.display='';document.getElementById('hud-count').textContent=20;document.getElementById('timer-bar').style.width='100%';}
  else{qLeft=10;totalTime=10;ts.style.display='none';cs.style.display='';document.getElementById('hud-count').textContent=10;document.getElementById('timer-bar').style.width='100%';}
  document.getElementById('hud-score').textContent='0';
  showScreen('quiz');generateQ();
}
function runTimer(s){timeLeft=s;document.getElementById('hud-timer').textContent=s;updateBar(s,s);timer=setInterval(()=>{timeLeft--;document.getElementById('hud-timer').textContent=timeLeft;updateBar(timeLeft,totalTime);if(timeLeft<=0){clearInterval(timer);endQuiz();}},1000);}
function endQuiz(){active=false;clearInterval(timer);Object.entries(sessionRes).forEach(([f,d])=>updateMastery(parseInt(f),d.correct,d.attempted));showResults();}
function showResults(){
  const pct=attempted>0?Math.round((correct/attempted)*100):0;
  document.getElementById('r-correct').textContent=correct;document.getElementById('r-total').textContent=attempted;document.getElementById('r-pct').textContent=pct+'%';
  let e,t;if(pct>=90){e='🌟';t='PERFECT!';}else if(pct>=75){e='🎯';t='GREAT WORK!';}else if(pct>=60){e='💪';t='KEEP GOING!';}else{e='📚';t='PRACTICE!';}
  document.getElementById('r-emoji').textContent=e;document.getElementById('r-title').textContent=t;
  const rows=document.getElementById('mr-rows');rows.innerHTML='';
  Object.entries(sessionRes).forEach(([f])=>{const lv=masteryLevel(parseInt(f));const lbl={none:'LEARNING',practicing:'PRACTICING',mastered:'MASTERED ✓'};rows.innerHTML+=`<div class="mr-row"><span class="mr-name">-${f}</span><span class="mr-pill ${lv}">${lbl[lv]}</span></div>`;});
  showScreen('results');
}
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');if(n==='home'){renderGrid();updateBtn();}}
function goHome(){clearInterval(timer);active=false;showScreen('home');}
document.addEventListener('keydown',e=>{if(!active)return;if(e.key>='0'&&e.key<='9')np(e.key);else if(e.key==='Backspace')npClear();else if(e.key==='Enter')submit();});
renderGrid();
</script>
</body>
</html>
